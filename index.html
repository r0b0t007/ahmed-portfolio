        <p>
          I build websites and SaaS products with AI in the loop — which is why they ship in weeks.
          Nine years delivering software for Bell, BMW and Bayer is why they don't fall over afterwards.
          Full-stack: React, TypeScript, Node.js, Java/Spring, Docker, Kubernetes, AWS. Certified Scrum
          Master (PSM I) and SAFe 6 Agilist. Remote-first, based in Tetouan, Morocco.
        </p>
        <h2>What I build</h2>
        <ul>
          <li><strong>Websites that rank and convert</strong> — marketing sites, landing pages and portfolios built from scratch, shipping with structured data, clean semantics, sitemap and Core Web Vitals treated as a requirement.</li>
          <li><strong>SaaS &amp; MVP builds</strong> — the smallest version that proves the thing: auth, data model, core flows, payments, deployed on infrastructure that won't need replacing.</li>
          <li><strong>Architecture &amp; technical rescue</strong> — audits, sequenced refactor plans and hands-on remediation for products that shipped fast and can no longer move.</li>
          <li><strong>AI-augmented automation</strong> — LLM workflows, agents, retrieval over your own documents, and integrations between systems that don't talk.</li>
        </ul>
        <h2>How I build</h2>
        <p>
          Four steps: a free written scope (1 week), the build (2 to 6 weeks typical, with a working link
          from week one), ship to your own infrastructure, then handover of the repo, pipeline and
          documentation. Fixed scope, fixed price, a date in writing.
        </p>
        <h2>Proof</h2>

          The first few client projects go out at founding rates in exchange for a case study and a reference.
        </p>
