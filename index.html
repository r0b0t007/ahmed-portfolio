    <!-- ── LCP image preload ──
         The hero portrait is the LCP element. The markup is prerendered, but it sits ~25 KB into

         `type` makes browsers without AVIF ignore the hint and fall through to the WebP in the
         <picture>. imagesrcset/imagesizes must stay in sync with src/components/Hero.jsx. -->
