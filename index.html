    <!-- ── LCP image preload, desktop only ──
         Above 900px the hero portrait is the LCP element. The markup is prerendered, but it sits
         ~25 KB into the document; preloading from <head> starts the fetch with the first bytes of
         HTML. `type` makes browsers without AVIF ignore the hint and fall through to the WebP in
         the <picture>. imagesrcset/imagesizes must stay in sync with src/components/HeroPortrait.jsx.

         `media` gates the hint to the layout where it is true. Below 900px the portrait is a 76px
         byline rendered after the CTA, so it is not the LCP (the <h1> is). It also keeps `href`
         honest: href is what Safari 16.x fetches, since imagesrcset only landed in Safari 17, and
         700w is the candidate the <picture> resolves to on a DPR-2 desktop (a 440px column wants
         880px), which is nearly every Mac. A DPR-1 desktop resolves to 440w or smaller, so a
         Safari 16.4-16.x on one would fetch both; that pairing is rare enough to leave. Ungated,
         phones would pull 34 KB of hero image and then fetch the 320w file they actually render.

         900.02px, not 901px: the layout switches at `max-width: 900px`, so a gate at 901 leaves
         the (900, 901) band matching neither rule. Browser zoom and fractional display scaling
         land there, and the desktop hero would render with no preload at all.

         The `type` on this hint is why HeroPortrait.jsx still sets fetchPriority on the <img>: browsers
         without AVIF (desktop Safari 16.0-16.3) drop this tag entirely, fall through to the WebP
         in the <picture>, and would otherwise fetch the desktop LCP at default priority. The cost
         is that below 900px the byline square is requested high too, ahead of the fonts. It is
         9 KB at the 320w candidate, which is the cheaper side of the trade. -->
    <link rel="preload" as="image" type="image/avif" href="/headshot-700.avif"
      media="(min-width: 900.02px)"
      imagesrcset="/headshot-320.avif 320w, /headshot-412.avif 412w, /headshot-440.avif 440w, /headshot-700.avif 700w"
      imagesizes="(max-width: 900px) 76px, min(33vw, 440px)"
      fetchpriority="high" />

    <!-- The header's index panel (Header.jsx). Everything it does that the markup can't is here,
         in one plain script, so it works from first paint, without the hydration chunk, and in
         browsers with or without popovers; Header.jsx holds no state for it.
         Where popovers exist, the browser opens and closes the panel (Escape, an outside click)
         and hands focus back to the key. This script adds what it doesn't do:
           - place the panel under the header's real bottom edge (a raised minimum font size makes
             the header taller than the 70px the CSS falls back to), on open and on resize;
           - close the panel when one of its links is followed. The link is blurred first: hiding
             a popover that holds focus sends focus back to the key, and the reader should land
             on the section they picked, not on the menu.
         Where they don't (Safari before 17), it does the rest too: toggles .is-open and
         aria-expanded on the key, closes on Escape (returning focus to the key if it was in the
         panel) and on a press outside. Listeners sit on document, so they work whether the
         header is prerendered or rendered later (dev). -->
    <script>
      (function () {
        var native = typeof HTMLElement.prototype.showPopover === 'function'
        function panel() { return document.getElementById('site-index') }
        function key() { return document.querySelector('.ed-index-key') }
        function isOpen(n) { return native ? n.matches(':popover-open') : n.classList.contains('is-open') }
        function place(n) { n.style.setProperty('--index-top', n.parentElement.getBoundingClientRect().bottom + 'px') }
        function setOpen(n, open) {
          if (native) { if (!open) n.hidePopover(); return }
          if (open) place(n)
          n.classList.toggle('is-open', open)
          var k = key()
          if (k) k.setAttribute('aria-expanded', String(open))
        }

        if (native) {
          document.addEventListener('beforetoggle', function (e) {
            if (e.target.id === 'site-index' && e.newState === 'open') place(e.target)
          }, true)
        } else {
          var k = key()
          if (k) k.setAttribute('aria-expanded', 'false')
          document.addEventListener('keydown', function (e) {
            var n = panel()
            if (e.key !== 'Escape' || !n || !isOpen(n)) return
            var inside = n.contains(document.activeElement)
            setOpen(n, false)
            if (inside) key().focus()
          })
          document.addEventListener('pointerdown', function (e) {
            var n = panel()
            if (n && isOpen(n) && !n.contains(e.target) && !e.target.closest('.ed-index-key')) setOpen(n, false)
          })
        }

        document.addEventListener('click', function (e) {
          var n = panel()
          if (!n) return
          if (!native && e.target.closest('.ed-index-key')) return setOpen(n, !isOpen(n))
          var link = e.target.closest('#site-index a')
          if (link && isOpen(n)) { link.blur(); setOpen(n, false) }
        })
        addEventListener('resize', function () {
          var n = panel()
          if (n && isOpen(n)) place(n)
        })
      })()
    </script>
