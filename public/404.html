<!doctype html>
<!--
  Served by Cloudflare Pages, with a 404 status, for any path that matches no file.

  Its presence is load-bearing: without a top-level 404.html, Pages assumes a single-page app and
  answers every unknown path with index.html and a 200, so typos and dead links look like
  duplicate homepages to Google instead of showing up as 404s in Search Console.

  Deliberately standalone (no bundle, no web fonts): it must render even if /assets/ is what broke.
  Colours are the --paper / --ink / --ink-muted / --teal / --hair tokens from src/index.css.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Ahmed Chioua</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#faf7f2" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:#faf7f2;color:#1a1c1a;
        font-family:system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5}
      main{max-width:34rem;width:100%;border-top:2px solid #1a1c1a;padding-top:20px}
      .code{font-family:ui-monospace,'SFMono-Regular',monospace;font-size:.8125rem;letter-spacing:.06em;
        text-transform:uppercase;color:#64665f}
      h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:clamp(2rem,6vw,2.75rem);
        line-height:1.1;margin:12px 0 16px}
      p{color:#64665f;margin-bottom:28px}
      a{color:#0e5f55;font-weight:600;text-underline-offset:3px}
      a:focus-visible{outline:2px solid #0e5f55;outline-offset:3px}
      nav{display:flex;flex-wrap:wrap;gap:12px 24px;border-top:1px solid #e2ddd3;padding-top:16px}
    </style>
  </head>
  <body>
    <main>
      <p class="code">Error 404</p>
      <h1>This page doesn’t exist.</h1>
      <p>The link may be out of date, or the address mistyped. Everything on this site lives on one page.</p>
      <nav aria-label="Where to go instead">
        <a href="/">Back to the homepage</a>
        <a href="/#contact">Get in touch</a>
      </nav>
    </main>
  </body>
</html>
