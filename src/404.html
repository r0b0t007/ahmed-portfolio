<!doctype html>
<!--
  Served by Cloudflare Pages, with a 404 status, for any path that matches no file. This is a
  template: the errorPage plugin in vite.config.js fills the PAGE_LINKS placeholder from the route table
  and emits the result as dist/404.html in every Vite build.

  Its presence is load-bearing: without a top-level 404.html, Pages assumes a single-page app and
  answers every unknown path with index.html and a 200, so typos and dead links look like
  duplicate homepages to Google instead of showing up as 404s in Search Console.

  Deliberately standalone (no bundle, no web fonts): it must render even if /assets/ is what broke.
  The :root block is a copy of tokens from src/index.css; the build fails if they drift
  (the errorPage plugin in vite.config.js).

  Pages also serves this file at /404, with a 200: every .html file gets an extensionless URL and
  there is no way to give that one route a 404 status without a Function. Nothing links to /404 and
  the page is noindex, so it is left as is.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Ahmed Chioua</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#edece7" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <style>
      :root{--paper:#edece7;--ink:#1d1b17;--ink-muted:#595b56;--signal:#ee6a1b;--signal-deep:#a8420c;--rule:#c6c4bc;
        --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--pad:clamp(20px,5vw,64px)}
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html,body{overflow-x:clip}
      /* Set against the top-left edge like every other page, not centred in the window. */
      body{min-height:100vh;padding:64px var(--pad);background:var(--paper);color:var(--ink);
        font-family:var(--sans);line-height:1.5}
      main{max-width:36rem;border-top:6px solid var(--ink);padding-top:20px}
      p{color:var(--ink-muted)}
      h1{font-family:var(--sans);font-weight:800;font-size:clamp(2rem,6vw,2.75rem);text-transform:uppercase;
        line-height:1.05;margin-bottom:16px;overflow-wrap:anywhere;min-width:0}
      .code{display:inline-block;padding:4px 8px;margin-top:4px;background:var(--signal);color:var(--ink);font-size:.8125rem;
        font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums}
      .lead{margin:16px 0 28px}
      a{color:var(--signal-deep);font-weight:600;text-underline-offset:3px}
      a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
      nav{display:flex;flex-wrap:wrap;gap:12px 24px;border-top:1px solid var(--rule);padding-top:16px}
      nav a{white-space:nowrap}
    </style>
  </head>
  <body>
    <main>
      <h1>This page doesn’t exist.</h1>
      <p class="code">Error 404</p>
      <p class="lead">The link may be out of date, or the address mistyped. These are the pages that exist:</p>
      <nav aria-label="Where to go instead">
        <!--PAGE_LINKS-->
        <a href="/#contact">Get in touch</a>
      </nav>
    </main>
    <!-- Cloudflare Web Analytics. Every other page loads the beacon from src/main.jsx, which this
         standalone page never loads, so it carries its own. Production host only; vite.config.js
         fills in the host and token. Speed doesn't matter here, so no after-paint wait, but it
         still steps aside if Cloudflare is injecting its own copy. -->
    <script>
      if (location.hostname === '__SITE_HOST__') addEventListener('DOMContentLoaded', function () {
        if (document.querySelector('script[data-cf-beacon]')) return
        var beacon = document.createElement('script')
        beacon.src = 'https://static.cloudflareinsights.com/beacon.min.js'
        beacon.setAttribute('data-cf-beacon', JSON.stringify({ token: '__ANALYTICS_TOKEN__' }))
        document.body.appendChild(beacon)
      })
    </script>
  </body>
</html>
