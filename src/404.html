<!doctype html>
<!--
  Served by Cloudflare Pages, with a 404 status, for any path that matches no file. This is a
  template: the errorPage plugin in vite.config.js fills the PAGE_LINKS placeholder from the route table
  and emits the result as dist/404.html in every Vite build.

  Its presence is load-bearing: without a top-level 404.html, Pages assumes a single-page app and
  answers every unknown path with index.html and a 200, so typos and dead links look like
  duplicate homepages to Google instead of showing up as 404s in Search Console.

  Deliberately standalone (no bundle, no web fonts): it must render even if /assets/ is what broke.
  The :root block is a copy of tokens from src/index.css; the build fails if they drift
  (the errorPage plugin in vite.config.js).

  Pages also serves this file at /404, with a 200: every .html file gets an extensionless URL and
  there is no way to give that one route a 404 status without a Function. Nothing links to /404 and
  the page is noindex, so it is left as is.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Ahmed Chioua</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f38230" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <style>
      :root{--signal:oklch(72% 0.165 52);--ink:oklch(20.5% 0.022 40);--on-signal-2:oklch(27% 0.06 45);--oxblood:oklch(30% 0.085 24)}
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--signal);color:var(--ink);
        font-family:system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5}
      main{max-width:36rem;width:100%;border-top:3px solid var(--ink);padding-top:20px}
      p{color:var(--on-signal-2)}
      .code{font-size:.8125rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
      h1{font-weight:800;font-stretch:125%;font-size:clamp(2rem,7vw,3rem);letter-spacing:-.02em;
        line-height:1.02;margin:12px 0 16px}
      .lead{margin-bottom:28px}
      a{color:var(--ink);font-weight:700;text-decoration-thickness:2px;text-underline-offset:4px}
      a:hover{color:var(--oxblood)}
      a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
      nav{display:flex;flex-wrap:wrap;gap:12px 24px;border-top:1.5px solid var(--ink);padding-top:16px}
    </style>
  </head>
  <body>
    <main>
      <p class="code">Error 404</p>
      <h1>This page doesn’t exist.</h1>
      <p class="lead">The link may be out of date, or the address mistyped. These are the pages that exist:</p>
      <nav aria-label="Where to go instead">
        <!--PAGE_LINKS-->
        <a href="/#contact">Get in touch</a>
      </nav>
    </main>
  </body>
</html>
