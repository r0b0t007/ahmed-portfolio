<!doctype html>
<!--
  Served by Cloudflare Pages, with a 404 status, for any path that matches no file. This is a
  template: the errorPage plugin in vite.config.js fills the PAGE_LINKS placeholder from the route table
  and emits the result as dist/404.html in every Vite build.

  Its presence is load-bearing: without a top-level 404.html, Pages assumes a single-page app and
  answers every unknown path with index.html and a 200, so typos and dead links look like
  duplicate homepages to Google instead of showing up as 404s in Search Console.

  Deliberately standalone (no bundle, no web fonts): it must render even if /assets/ is what broke.
  The :root block is a copy of tokens from src/index.css; the build fails if they drift
  (the errorPage plugin in vite.config.js).

  Pages also serves this file at /404, with a 200: every .html file gets an extensionless URL and
  there is no way to give that one route a 404 status without a Function. Nothing links to /404 and
  the page is noindex, so it is left as is.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Ahmed Chioua</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f8fcfc" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <style>
      :root{--color-desk:oklch(94.6% 0.008 190);--color-paper:oklch(98.8% 0.004 190);--color-ink:oklch(19% 0.012 190);--color-ink-2:oklch(35% 0.012 190);--color-muted:oklch(47% 0.012 190);--color-rule:oklch(86% 0.008 190);--color-accent:oklch(43.8% 0.074 182);--color-focus:oklch(48% 0.08 182)}
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html,body{overflow-x:clip}
      body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--color-desk);color:var(--color-ink);
        font-family:system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.55}
      main{max-width:36rem;width:100%;background:var(--color-paper);border:1px solid var(--color-rule);padding:28px 24px}
      p{color:var(--color-ink-2)}
      .code{font-family:ui-monospace,'SFMono-Regular',monospace;font-size:.8125rem;letter-spacing:.06em;
        text-transform:uppercase;color:var(--color-muted);border-bottom:1px solid var(--color-ink);padding-bottom:10px}
      h1{font-weight:800;font-size:clamp(1.75rem,5vw,2.25rem);letter-spacing:-.02em;line-height:1.1;margin:18px 0 12px;overflow-wrap:anywhere}
      .lead{margin-bottom:24px}
      a{color:var(--color-accent);font-weight:600;text-underline-offset:3px;white-space:nowrap}
      a:focus-visible{outline:2px solid var(--color-focus);outline-offset:3px}
      nav{display:flex;flex-wrap:wrap;gap:12px 24px;border-top:1px solid var(--color-rule);padding-top:16px}
    </style>
  </head>
  <body>
    <main>
      <p class="code">Scope of work · Error 404</p>
      <h1>This page doesn’t exist.</h1>
      <p class="lead">The link may be out of date, or the address mistyped. These are the pages that exist:</p>
      <nav aria-label="Where to go instead">
        <!--PAGE_LINKS-->
        <a href="/#contact">Get in touch</a>
      </nav>
    </main>
  </body>
</html>
